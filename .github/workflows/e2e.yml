name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        run: supabase db reset --linked=false
      - name: Capture local Supabase keys
        id: keys
        run: |
          ANON=$(npx --yes supabase status --output json | jq -r '.ANON_KEY')
          SVC=$(npx --yes supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "anon=$ANON" >> $GITHUB_OUTPUT
          echo "service=$SVC" >> $GITHUB_OUTPUT
      - name: Build app
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build
      - name: Run Playwright tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:3000 -t 60000
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
